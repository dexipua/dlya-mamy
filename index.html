<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для найкращої мами 💐</title>
<meta property="og:title" content="Для найкращої мами 💐">
<meta property="og:description" content="Відкрий конверт — там дещо для тебе ❤️">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:#e85d75;--rose-d:#c2405a;--peach:#ffd6c9;--cream:#fff8f1;--ink:#4a2c35;--gold:#f2b544}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3ea 0%,#fff1e6 45%,#ffe9f3 100%);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
h1,h2,.hand{font-family:Caveat,cursive}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.petal{position:fixed;top:-40px;pointer-events:none;z-index:1;animation:fall linear forwards;opacity:.85}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(var(--dx))}}

/* intro / envelope */
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;text-align:center;position:relative;z-index:2}
#intro p{font-size:1.6rem}
.env{width:min(320px,82vw);aspect-ratio:3/2;position:relative;cursor:pointer;filter:drop-shadow(0 18px 30px rgba(194,64,90,.25));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
.env .back{position:absolute;inset:0;background:#f7a8b6;border-radius:10px}
.env .front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#f9b9c4 50%,transparent 50%) left/50% 100% no-repeat,linear-gradient(225deg,#f9b9c4 50%,transparent 50%) right/50% 100% no-repeat,linear-gradient(0deg,#fbc7cf 50%,transparent 50%);z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#f48da0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;z-index:4;border-radius:10px 10px 0 0}
.env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.6rem;z-index:5;transition:opacity .3s}
.env .card{position:absolute;left:7%;right:7%;top:10%;bottom:8%;background:var(--cream);border-radius:6px;z-index:2;display:grid;place-items:center;font-family:Caveat;font-size:1.8rem;color:var(--rose-d);transition:transform .8s cubic-bezier(.3,1.4,.5,1) .5s}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-70%)}
.tap{font-size:1rem;opacity:.7;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* main */
#main{display:none;position:relative;z-index:2}
section{max-width:760px;margin:0 auto;padding:72px 16px;text-align:center}
.hero h1{font-size:clamp(3.2rem,12vw,6rem);line-height:1;color:var(--rose-d);text-shadow:0 4px 0 #fff}
.hero h1 span{display:inline-block;animation:wave 2s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-8px)}}
.letter{background:var(--cream);border-radius:18px;padding:32px 24px;margin-top:32px;box-shadow:0 20px 50px -20px rgba(194,64,90,.35);text-align:left;font-size:1.15rem;line-height:1.7;min-height:220px;position:relative}
.letter::before{content:"";position:absolute;inset:10px;border:2px dashed #f6b9c4;border-radius:12px;pointer-events:none}
#typed::after{content:"|";animation:pulse .8s infinite;color:var(--rose)}
#typed.done::after{content:""}
h2{font-size:clamp(2.4rem,8vw,3.4rem);color:var(--rose-d);margin-bottom:8px}
.sub{opacity:.75;margin-bottom:28px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.flip{aspect-ratio:1;perspective:800px;cursor:pointer;border:0;background:none;font:inherit;color:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;padding:14px;backface-visibility:hidden;box-shadow:0 10px 24px -12px rgba(194,64,90,.5)}
.flip .f{background:linear-gradient(145deg,#ff8fa3,#e85d75);color:#fff;font-size:2.8rem}
.flip .f small{display:block;font-size:.85rem;font-weight:800;opacity:.9}
.flip .b{background:#fff;transform:rotateY(180deg);font-weight:700;font-size:1rem;line-height:1.35}

#garden{height:300px;border-radius:24px;background:linear-gradient(#fff6 0,#fff0 60%),linear-gradient(0deg,#9bd48a 0 22%,transparent 22%);position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 -6px 0 #7cbc6b;touch-action:manipulation}
#garden .hint{position:absolute;top:40%;left:0;right:0;opacity:.6;font-weight:700;transition:opacity .4s}
.flower{position:absolute;bottom:14%;transform-origin:bottom center;animation:grow .7s cubic-bezier(.3,1.6,.5,1) both;font-size:2.6rem;display:flex;flex-direction:column;align-items:center}
.flower i{display:block;width:4px;background:#5aa04a;border-radius:2px;order:2}
@keyframes grow{from{transform:scale(0)}}
#count{margin-top:12px;font-weight:700;color:var(--rose-d)}

.hug{font:800 1.25rem Nunito;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:18px 36px;cursor:pointer;box-shadow:0 8px 0 var(--rose-d),0 18px 30px -10px rgba(194,64,90,.6);transition:transform .1s}
.hug:active{transform:translateY(6px);box-shadow:0 2px 0 var(--rose-d)}
.meter{width:min(320px,80vw);height:22px;border-radius:99px;background:#fff;margin:24px auto 0;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.1)}
.meter div{height:100%;width:0;background:linear-gradient(90deg,#ffb3c1,var(--rose),var(--gold));transition:width .3s}
#hugmsg{margin-top:14px;font-family:Caveat;font-size:2rem;color:var(--rose-d);min-height:2.4rem}
footer{padding:40px 16px 60px;text-align:center;font-family:Caveat;font-size:1.8rem}
.reveal{opacity:0;transform:translateY(30px);transition:1s}
.reveal.vis{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="intro">
  <p class="hand">Мамо, тут дещо для тебе…</p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Відкрити конверт">
    <div class="back"></div>
    <div class="card">з любов'ю ❤️</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">💌</div>
  </div>
  <p class="tap">натисни на конверт</p>
</div>

<div id="main">
  <section class="hero">
    <h1><span>Найкращій</span> <span style="animation-delay:.2s">мамі</span> <span style="animation-delay:.4s">💐</span></h1>
    <div class="letter"><p id="typed"></p></div>
  </section>

  <section class="reveal">
    <h2>Чому ти найкраща</h2>
    <p class="sub">Переверни кожну картку 👇</p>
    <div class="cards" id="cards"></div>
  </section>

  <section class="reveal">
    <h2>Садочок для тебе</h2>
    <p class="sub">Торкайся — і виростуть квіти 🌷</p>
    <div id="garden"><div class="hint">тап-тап сюди</div></div>
    <p id="count"></p>
  </section>

  <section class="reveal">
    <h2>Віртуальні обійми</h2>
    <p class="sub">Натискай, поки шкала не заповниться</p>
    <button class="hug" id="hug">🤗 Обійняти</button>
    <div class="meter"><div id="bar"></div></div>
    <p id="hugmsg"></p>
  </section>

  <footer class="reveal">Люблю тебе безмежно ❤️<br>твій син</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);

// --- confetti hearts on canvas ---
const cv = $('#fx'), cx = cv.getContext('2d');
let parts = [];
const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); };
fit(); addEventListener('resize', fit);
function burst(x, y, n = 60) {
  const e = ['❤️','💖','💕','🌸','✨','🌷','💗'];
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(3, 11);
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: rnd(14, 30), r: rnd(0, 6), vr: rnd(-.2, .2), t: e[i % e.length], life: 1});
  }
}
(function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .98; p.r += p.vr; p.life -= .012;
    cx.save(); cx.globalAlpha = Math.max(p.life, 0); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.font = p.s + 'px serif'; cx.fillText(p.t, -p.s / 2, p.s / 2); cx.restore();
  }
  requestAnimationFrame(loop);
})();

// --- falling petals ---
function petal() {
  const el = document.createElement('div');
  el.className = 'petal';
  el.textContent = ['🌸','🌷','🌺','💮','🤍'][Math.floor(rnd(0, 5))];
  el.style.left = rnd(0, 100) + 'vw';
  el.style.fontSize = rnd(14, 28) + 'px';
  el.style.setProperty('--dx', rnd(-80, 80) + 'px');
  el.style.animationDuration = rnd(7, 14) + 's';
  document.body.append(el);
  setTimeout(() => el.remove(), 15000);
}
setInterval(petal, 700);

// --- envelope ---
const env = $('#env');
function openEnv() {
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 3, 90), 700);
  setTimeout(() => {
    $('#intro').style.display = 'none';
    $('#main').style.display = 'block';
    scrollTo(0, 0);
    typeIt();
    burst(innerWidth / 2, innerHeight / 3, 70);
  }, 2000);
}
env.addEventListener('click', openEnv);
env.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && openEnv());

// --- typed letter ---
const text = `Мамо, дорога моя!

Дякую тобі за кожен день, за твою турботу, теплі обійми і за те, що ти завжди віриш у мене — навіть тоді, коли я сам у себе не вірю.

Ти — моя опора, моє натхнення і найрідніша людина на світі. Бажаю тобі міцного здоров'я, спокою на душі, багато радості та щоб усмішка ніколи не сходила з твого обличчя.

Люблю тебе більше, ніж можна написати словами ❤️`;
function typeIt() {
  const el = $('#typed'); let i = 0;
  (function step() {
    el.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(step, text[i - 1] === '\n' ? 250 : rnd(18, 45));
    else el.classList.add('done');
  })();
  el.style.whiteSpace = 'pre-line';
}

// --- reasons cards ---
const reasons = [
  ['🤗','обійми','Твої обійми лікують усе на світі'],
  ['🍲','смаколики','Ніхто не готує так смачно, як ти'],
  ['🌟','віра','Ти завжди віриш у мене'],
  ['😂','сміх','З тобою завжди весело'],
  ['🧠','мудрість','Твої поради — найкращі'],
  ['💪','сила','Ти найсильніша людина, яку я знаю'],
  ['☀️','тепло','Поруч із тобою — як удома'],
  ['❤️','любов','Ти любиш просто так, без умов'],
];
const cards = $('#cards');
reasons.forEach(([e, w, t]) => {
  const b = document.createElement('button');
  b.className = 'flip';
  b.innerHTML = `<div class="in"><div class="f"><div>${e}<small>${w}</small></div></div><div class="b">${t}</div></div>`;
  b.onclick = ev => { b.classList.toggle('on'); if (b.classList.contains('on')) burst(ev.clientX, ev.clientY, 14); };
  cards.append(b);
});

// --- garden ---
const garden = $('#garden'); let planted = 0;
const fl = ['🌷','🌸','🌼','🌻','🌹','🌺','💐'];
const msgs = {5:'Вже букетик! 💐', 15:'Справжня клумба! 🌼', 30:'Цілий сад для мами! 🌳', 50:'Мамо, це весна посеред листопада! 🌸'};
garden.addEventListener('pointerdown', e => {
  const r = garden.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'flower';
  const h = rnd(30, 120);
  f.innerHTML = `<span>${fl[Math.floor(rnd(0, fl.length))]}</span><i style="height:${h}px"></i>`;
  f.style.left = (e.clientX - r.left - 20) + 'px';
  f.style.fontSize = rnd(1.8, 3) + 'rem';
  garden.append(f);
  garden.querySelector('.hint').style.opacity = 0;
  planted++;
  $('#count').textContent = (msgs[planted] || `Квіточок: ${planted}`);
  if (msgs[planted]) burst(e.clientX, e.clientY, 30);
});

// --- hugs ---
let hug = 0;
const hugTexts = ['Ще трошки…','Міцніше! 💞','Майже-майже…','Ооо, як тепло…'];
$('#hug').addEventListener('click', e => {
  if (hug >= 100) { hug = 0; }
  hug = Math.min(100, hug + 10);
  $('#bar').style.width = hug + '%';
  burst(e.clientX, e.clientY, 10);
  if (hug >= 100) {
    $('#hugmsg').textContent = 'Найміцніші обійми у світі! Люблю тебе, мамо ❤️';
    for (let i = 0; i < 5; i++) setTimeout(() => burst(rnd(0, innerWidth), rnd(0, innerHeight / 2), 60), i * 250);
    navigator.vibrate?.(200);
  } else $('#hugmsg').textContent = hugTexts[Math.floor(hug / 26)];
});

// --- reveal on scroll ---
const io = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add('vis')), {threshold: .15});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
